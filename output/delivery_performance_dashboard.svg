<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Arial, Helvetica, sans-serif">
<rect width="1000" height="420" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Supply Chain Delivery Performance Dashboard</text>
<text x="500" y="62" text-anchor="middle" font-size="13" fill="#555">5,000 simulated delivery orders | On-time delivery, carrier and delivery-type performance</text>
<text x="60" y="105" font-size="15" font-weight="bold" fill="#111">On-time delivery rate by carrier</text>
<g>
<rect x="80" y="130" width="373" height="28" fill="#4C72B0"/><text x="462" y="149" font-size="12" fill="#111">Carrier A: 62.2%</text>
<rect x="80" y="170" width="392" height="28" fill="#4C72B0"/><text x="481" y="189" font-size="12" fill="#111">Carrier B: 65.3%</text>
<rect x="80" y="210" width="385" height="28" fill="#4C72B0"/><text x="474" y="229" font-size="12" fill="#111">Carrier C: 64.1%</text>
<rect x="80" y="250" width="246" height="28" fill="#C44E52"/><text x="335" y="269" font-size="12" fill="#111">Carrier D: 41.0%</text>
</g>
<text x="620" y="105" font-size="15" font-weight="bold" fill="#111">Urban vs rural delivery</text>
<rect x="640" y="140" width="220" height="30" fill="#55A868"/><text x="870" y="160" font-size="12" fill="#111">Urban: 66.8%</text>
<rect x="640" y="190" width="142" height="30" fill="#C44E52"/><text x="792" y="210" font-size="12" fill="#111">Rural: 43.2%</text>
<text x="620" y="260" font-size="13" fill="#333">Rural deliveries are 23.6 percentage points</text>
<text x="620" y="280" font-size="13" fill="#333">below urban deliveries in on-time rate.</text>
<text x="60" y="330" font-size="15" font-weight="bold" fill="#111">Key recommendation</text>
<text x="60" y="356" font-size="13" fill="#333">1. Review Carrier D volume and performance; it has the lowest on-time rate.</text>
<text x="60" y="378" font-size="13" fill="#333">2. Add rural delivery buffers and improve rural route capacity.</text>
<text x="60" y="400" font-size="13" fill="#333">3. Plan additional capacity for November and December peak-season demand.</text>
</svg>